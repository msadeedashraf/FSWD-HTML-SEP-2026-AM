  <head>
    <meta charset="UTF-8" />

    <title>Chapter 09</title>
    <style>
        .my-video{

            width: 100%;
            max-width: 250px;
            max-height: 200px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            

        }

        .my-video:hover
        {
          transform: scale(1.02);  
        }
    </style>
  </head>
  <body>
    <h1>Youtube Example</h1>

    <hr />
    <h2>Learning HTML CSS</h2>
    <iframe
    class="my-video"
      width="560"
      height="315"
      src="https://www.youtube.com/embed/qz0aGYrrlhU?si=P5u4Y0xbB2CpLUIZ"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
