<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Form Example</title>

  <body>
    <h1>Contact Us</h1>
    <form action="">
      <p>
        Username: <input type="text" name="uname" size="20" maxlength="15" required />
      </p>
      <p>Password: <input type="password" required/></p>

      <button>Submit</button>
      <br>
      <hr>
      <br>
      <input type="button" value="Click" >
      <p>What did you think of this gig?</p>

      <textarea name="comments" cols="20" rows="4">
   Enter your comments...
    </textarea
      >

      <p>
        Your fav genre:
        <br>
        <input type="radio" name="r" value="1" > Rock
        <input type="radio" name="j" value="2" > Jazz
        <input type="radio" name="p" value="3" checked> Pop
      </p>


      <p>Your favorite music service:<br />
 <input type="checkbox" name="service"
  value="iTunes" 
  /> iTunes

 <input type="checkbox" name="service"
  value="Last.fm" /> Last.fm

 <input type="checkbox" name="service"
  value="Spotify"  checked="checked"/> Spotify
</p>

<select name="devices" size="5">

 <option value="iPod"
  selected="selected">iPod</option>

 <option value="radio">Radio</option>

 <option value="PC">Computer</option>
 <option value="PC">Computer</option>
 <option value="PC">Computer</option>
 <option value="PC" selected="selected">Computer</option>
 <option value="PC">Computer</option>
 <option value="PC">Computer</option>

</select>



<form action="http://eg.com/upload.php"
      method="post">

 <p>Upload your song in MP3 format:</p>

 <input type="file" name="user-song" />

 <input type="submit" value="upload" />

</form>


<br>
<hr>
<br>
<fieldset>
 <legend>Contact details</legend>
 <label>Email:<br />

</fieldset>







    </form>
